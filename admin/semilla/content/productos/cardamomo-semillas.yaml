descripcion: "El Cardamomo es una especia de sabor intenso, dulce y picante que se utiliza en la cocina para aromatizar postres, bebidas y platos salados. Procedente de la India, ésta semillas tiene propiedades digestivas, antiinflamatorias y antioxidantes. Su aroma es exótico y su sabor es versátil, ya que se puede utilizar en platos salados como currys, arroces y guisos, así como en postres y bebidas como el té chai y el café. Entre las propiedades del cardamomo, se destacan las siguientes: – Es un antiséptico natural que ayuda a eliminar las bacterias que causan el mal aliento y las caries."
