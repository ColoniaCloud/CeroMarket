descripcion: El psyllium husk es la cáscara de las semillas de una planta llamada Plantago ovata. Es una fuente natural de fibra soluble que puede ayudar a regular el tránsito intestinal, prevenir el estreñimiento y reducir el colesterol. El psyllium husk se puede consumir en forma de polvo, cápsulas o tabletas, mezclado con agua u otros líquidos.
