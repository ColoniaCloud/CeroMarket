descripcion: Los hongos shitake son un tipo de seta originaria de Asia que se caracteriza por su sabor intenso y su textura carnosa. Se pueden consumir frescos o secos, y se utilizan en diversas recetas de cocina oriental y occidental. Los hongos shitake trozados son aquellos que se han cortado en pedazos pequeños, generalmente de forma irregular, para facilitar su cocción y su mezcla con otros ingredientes. Los hongos shitake trozados son una buena fuente de proteínas, fibra, vitaminas y minerales, y tienen propiedades beneficiosas para la salud.
