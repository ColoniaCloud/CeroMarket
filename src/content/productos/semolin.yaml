descripcion: El semolín es un tipo de harina gruesa que se obtiene de la molienda del trigo duro. Se utiliza para elaborar pastas, cuscús, gachas y otros platos. El semolín tiene un color amarillento y una textura granulada. Es rico en proteínas, carbohidratos y fibra, y tiene un sabor suave y ligeramente dulce.
