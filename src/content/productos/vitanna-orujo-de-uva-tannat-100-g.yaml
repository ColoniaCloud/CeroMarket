descripcion: VITANNA es un suplemento dietario natural. Contiene vitaminas y minerales. El Orujo de uvas tannat presenta vitaminas hidrosolubles ( ácido ascórbico, vitamina B1, B2, B3, B5 y B7 ), así como minerales ( potasio, sodio, calcio, magnesio). Su contenido en fibras es muy elevado comparado con el de otros productos integrales disponibles en el mercado, tiene un 50% de fibra dietaria. Es un antioxidante natural. Se recomienda tomar 2 cucharaditas diarias, mezcladas en jugos, licuados, yogur, cereales, leches, kéfir, o en la bebida que prefieras.
