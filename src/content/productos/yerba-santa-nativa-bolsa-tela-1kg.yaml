descripcion: La yerba Santa nativa es una yerba suave, agradable, de molienda gruesa y sin polvillo. Su producción es agroecológica, ya que es cosechada a mano por pequeños productores, secada sin horno, de manera natural y estacionada durante 12 meses. Las plantaciones de la yerba Santa se encuentran en el monte nativo, en un entorno natural y silvestre, por lo tanto no tiene tratamientos químicos. A continuación te contamos algunos de los beneficios de tomar mate.
