descripcion: Proveniente de la región de Mogiana (dividida entre los estados de São Paulo y Minas Gerais), ubicada en el municipio de Cássia dos Coqueiros, se hace lugar la Hacienda San Francisco (Fazenda São Francisco). Región de geografía ondulada e irregular. São Francisco es administrada por Fernando Sarreta en nombre de su familia, que estableció la finca por primera vez hace más de 40 años. Es una de las primeras fincas de la región en establecer prácticas orgánicas certificadas.
