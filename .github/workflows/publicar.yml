name: Publicar

# Revisa y compila el sitio, y deja el resultado (dist/) en la rama
# "produccion". Hostinger está conectado a esa rama y la publica sola en
# ceromarket.com.uy. La rama "produccion" no se toca a mano: se reescribe
# entera en cada publicación.
#
# Se dispara con:
# - un push a main que toque el sitio (los cambios solo de admin/ no, porque
#   el panel se publica aparte, en admin.ceromarket.com.uy);
# - el panel, al guardar un producto, una nota o los datos del local o al
#   aplicar una lista de precios (ver admin/lib/publicar.ts);
# - a mano, desde la pestaña Actions.
on:
  push:
    branches: [main]
    paths-ignore: ["admin/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # npm install y no npm ci: el lockfile se genera en Windows y npm no
      # anota ahí algunas dependencias de paquetes opcionales de otras
      # plataformas (@emnapi/* de los bindings wasm32). npm ci lo rechaza;
      # npm install completa lo que falta y respeta el resto de versiones.
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      # Si un producto o un post cargado en Keystatic no cumple el esquema,
      # se corta acá y el sitio publicado queda como estaba.
      - name: Revisar tipos y contenido
        run: npm run check

      - name: Compilar
        run: npm run build

      - name: Dejar el sitio compilado en la rama produccion
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # https://ceromarket.com.uy/version.txt dice qué commit está publicado.
          echo "${GITHUB_SHA}" > version.txt
          git init -q -b produccion
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publica ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" produccion
