name: Publicar

# Cada push a main revisa y compila el sitio, y deja el resultado (dist/) en
# la rama "produccion". Hostinger está conectado a esa rama y la publica sola
# en ceromarket.com.uy. La rama "produccion" no se toca a mano: se reescribe
# entera en cada publicación.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Si un producto o un post cargado en Keystatic no cumple el esquema,
      # se corta acá y el sitio publicado queda como estaba.
      - name: Revisar tipos y contenido
        run: npm run check

      - name: Compilar
        run: npm run build

      - name: Dejar el sitio compilado en la rama produccion
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b produccion
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publica ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" produccion
